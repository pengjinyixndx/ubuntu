<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#f3ead4">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/icons/192.png">
    <meta name="apple-mobile-web-app-title" content="青桃">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>青桃</title>

    <style>
      /* —— 预热页：一句情话，App 挂载后淡出 —— */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3ead4;
        transition: opacity 0.45s ease;
      }
      #splash.fade {
        opacity: 0;
        pointer-events: none;
      }
      .splash-inner {
        text-align: center;
        padding: 0 40px;
        margin-top: -6vh;
      }
      .splash-heart {
        width: 26px;
        color: #ad4f38;
      }
      .splash-quote {
        max-width: 340px;
        margin: 18px auto 0;
        font-family: 'Songti SC', 'STSong', 'SimSun', serif;
        font-size: 27px;
        line-height: 1.8;
        letter-spacing: 1px;
        color: #2b251d;
      }
      .splash-source {
        margin-top: 16px;
        font-family: 'Songti SC', 'STSong', 'SimSun', serif;
        font-size: 13px;
        letter-spacing: 1px;
        color: #897b61;
      }
      .splash-sign {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(20px + env(safe-area-inset-bottom));
        text-align: center;
        font-family: 'Courier New', monospace;
        font-size: 10px;
        letter-spacing: 4px;
        color: #b3a588;
      }
    </style>
  </head>
  <body>
    <!-- 预热封面：一句情话 -->
    <div id="splash">
      <div class="splash-inner">
        <svg class="splash-heart" viewBox="0 0 40 38" fill="none" aria-hidden="true">
          <path
            d="M20 34 C 5 23 3 13 10 8 C 15 5 20 10 20 14 C 20 10 25 5 30 8 C 37 13 35 23 20 34 Z"
            stroke="currentColor"
            stroke-width="2.3"
            stroke-linejoin="round"
          />
        </svg>
        <div class="splash-quote" id="splash-quote">执子之手，与子偕老。</div>
        <div class="splash-source" id="splash-source">——《诗经·邶风·击鼓》</div>
      </div>
      <div class="splash-sign">青桃 · PRIVATE LETTER</div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // 每日一句情话：按自然日轮换，两个人同一天看到同一句
      var QT_QUOTES = [
        ['执子之手，与子偕老。', '《诗经·邶风·击鼓》'],
        ['两情若是久长时，又岂在朝朝暮暮。', '秦观《鹊桥仙》'],
        ['愿得一人心，白首不相离。', '卓文君《白头吟》'],
        ['只愿君心似我心，定不负相思意。', '李之仪《卜算子》'],
        ['在天愿作比翼鸟，在地愿为连理枝。', '白居易《长恨歌》'],
        ['金风玉露一相逢，便胜却人间无数。', '秦观《鹊桥仙》'],
        ['曾经沧海难为水，除却巫山不是云。', '元稹《离思》'],
        ['身无彩凤双飞翼，心有灵犀一点通。', '李商隐《无题》'],
        ['青青子衿，悠悠我心。', '《诗经·郑风·子衿》'],
        ['一日不见，如三秋兮。', '《诗经·王风·采葛》']
      ];
      var QT_DAY = Math.floor(Date.now() / 86400000);
      var QT_PICK = QT_QUOTES[QT_DAY % QT_QUOTES.length];
      document.getElementById('splash-quote').textContent = QT_PICK[0];
      document.getElementById('splash-source').textContent = '——' + QT_PICK[1];
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
